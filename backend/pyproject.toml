[project]
name = "backend"
version = "0.1.0"
description = "RavenChess Backend"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
backend = "backend.main:main"

[build-system]
requires = ["maturin>=1.12.6"]
build-backend = "maturin"

[tool.maturin]
python-source = "src"
manifest-path = "../engine/Cargo.toml"
module-name = "backend.engine"

[dependency-groups]
dev = [
    "maturin>=1.12.6",
    "ruff>=0.15.4",
]
